<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da Oficina</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#d1d5db;--btn:#1f3864;
--ok:#15803d;--okbg:#dcfce7;--warn:#a16207;--warnbg:#fef9c3;--late:#b91c1c;--latebg:#fee2e2;
--pause:#1d4ed8;--pausebg:#dbeafe;--done:#475569;--donebg:#e2e8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#475569;--btn:#3b5998;
--ok:#4ade80;--okbg:#14532d;--warn:#fde047;--warnbg:#713f12;--late:#fca5a5;--latebg:#7f1d1d;--pause:#93c5fd;--pausebg:#1e3a8a;--done:#cbd5e1;--donebg:#334155}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
h1{margin:0;font-size:1.4rem}
#clock{font-size:2rem;font-weight:bold;font-variant-numeric:tabular-nums}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--bd);margin-bottom:14px}
label{font-size:.75rem;color:var(--mut);display:flex;flex-direction:column;gap:3px}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);min-width:0}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:9px 12px;background:var(--btn);color:#fff}
form button{align-self:end}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tab.on{background:var(--btn);color:#fff}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.grp{grid-column:1/-1;margin:8px 0 0;font-size:1.1rem}
.car{border-radius:12px;padding:14px;border-left:10px solid;display:flex;flex-direction:column;gap:6px}
.car.ok{background:var(--okbg);border-color:var(--ok)}
.car.warn{background:var(--warnbg);border-color:var(--warn)}
.car.late{background:var(--latebg);border-color:var(--late)}
.car.pause{background:var(--pausebg);border-color:var(--pause)}
.car.done{background:var(--donebg);border-color:var(--done);opacity:.85}
.car.wait{background:var(--card);border-color:var(--mut)}
.plate{font-size:1.05rem;font-weight:bold;letter-spacing:1px;word-break:break-all}
.mut{color:var(--mut);font-size:.9rem}
.time{font-size:1.5rem;font-weight:bold;font-variant-numeric:tabular-nums}
.ok .time{color:var(--ok)}.warn .time{color:var(--warn)}.late .time{color:var(--late)}.done .time{color:var(--done)}.pause .time{color:var(--pause);font-size:1.2rem}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.row button{font-size:.85rem;padding:7px 10px}
.row .sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.empty{color:var(--mut);text-align:center;padding:30px;grid-column:1/-1}
.ro form,.ro .row{display:none}
</style>
</head>
<body>
<header><h1>Painel da Oficina</h1><div id="clock">--:--:--</div><div><button id="login" onclick="entrar()">Entrar para editar</button><button id="logout" style="display:none" onclick="sair()">Sair</button></div></header>
<form id="f" onsubmit="return false">
<label>Lançar em<select id="dest"><option value="work">Em serviço</option><option value="queue">Próximo da fila</option><option value="sched">Agendado</option></select></label>
<label>Nº da OS<input id="os" placeholder="1234"></label>
<label>Chassi<input id="placa" maxlength="17" placeholder="9BD1234567890ABCD"></label>
<label>Cliente<input id="carro" placeholder="Nome do cliente"></label>
<label>Serviço<input id="serv" placeholder="Troca de óleo"></label>
<label>Mecânico<input id="mec" placeholder="Nome do mecânico"></label>
<label>Pronto até (em serviço)<input id="hora" type="time"></label>
<label>Agendado para (agenda)<input id="ag" type="datetime-local"></label>
<button id="add">Adicionar</button>
<button id="cancel" style="display:none;background:transparent;color:var(--tx);border:1px solid var(--bd)">Cancelar edição</button>
</form>
<div id="tabs"></div>
<div id="list"></div>
<script>
var items=[],tab="work",editId=null,canEdit=false,senha="",busy=false;
function $(i){return document.getElementById(i)}
function pad(n){return String(n).padStart(2,"0")}
function fmt(ms){var s=Math.floor(Math.abs(ms)/1000);return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function hm(t){var d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML}
function dlabel(t){var a=new Date(t),n=new Date();a.setHours(0,0,0,0);n.setHours(0,0,0,0);var k=Math.round((a-n)/864e5);
return k===0?"Hoje":k===1?"Amanhã":k<0?"Dias anteriores":pad(a.getDate())+"/"+pad(a.getMonth()+1)}
try{senha=localStorage.getItem("oficina_senha")||""}catch(e){}
function setRo(){document.body.classList.toggle("ro",!canEdit);$("login").style.display=canEdit?"none":"";$("logout").style.display=canEdit?"":"none"}
function pull(){if(busy)return;fetch("/api/estado",{headers:{"x-senha":senha}}).then(function(r){return r.json()}).then(function(d){if(busy)return;items=d.items||[];canEdit=!!d.canEdit;setRo();render()}).catch(function(){})}
function save(){busy=true;fetch("/api/estado",{method:"PUT",headers:{"Content-Type":"application/json","x-senha":senha},body:JSON.stringify({items:items})}).then(function(r){busy=false;if(r.status===401){canEdit=false;setRo();alert("Senha inválida. Entre de novo para editar.");pull()}else if(!r.ok)alert("Não foi possível salvar. Tente de novo.")}).catch(function(){busy=false;alert("Sem conexão. Tente de novo.")})}
function entrar(){var x=prompt("Senha para editar:");if(!x)return;senha=x;fetch("/api/estado",{headers:{"x-senha":senha}}).then(function(r){return r.json()}).then(function(d){if(d.canEdit){try{localStorage.setItem("oficina_senha",senha)}catch(e){}canEdit=true;items=d.items||[];setRo();render()}else alert("Senha incorreta.")}).catch(function(){alert("Sem conexão.")})}
function sair(){senha="";try{localStorage.removeItem("oficina_senha")}catch(e){}canEdit=false;setRo()}
function setTab(t){tab=t;render()}
function card(c,now){
var st=c.st||"work",cl,tx,sub="";
if(st==="work"){var ref=c.pausedAt||now,s=c.s||c.t-7200000,d=c.t-ref,p=(ref-s)/Math.max(c.t-s,1);
cl=c.done?"done":c.pausedAt?"pause":(d<0||p>=.8)?"late":p>=.5?"warn":"ok";
tx=c.done?"Pronto ✔":(c.pausedAt?"⏸ Pausado · ":"")+(d>=0?"Faltam ":"Atrasado ")+fmt(d);sub="Pronto até "+hm(c.t)}
else{cl="wait";tx=st==="sched"?"Agendado "+hm(c.ag):"Aguardando";sub=c.t?"Previsão "+hm(c.t):""}
return '<div class="car '+cl+'">'+(c.os?'<div class="mut">OS nº <b>'+esc(c.os)+'</b></div>':'')+
'<div class="plate">'+esc(c.placa||"SEM CHASSI")+'</div><div>Cliente: <b>'+esc(c.carro)+'</b></div><div class="mut">'+esc(c.serv)+'</div>'+
(c.mec?'<div>Mecânico: <b>'+esc(c.mec)+'</b></div>':'')+(c.pausedAt&&c.obs?'<div>Obs.: <b>'+esc(c.obs)+'</b></div>':'')+
'<div class="mut">'+sub+'</div><div class="time">'+tx+'</div><div class="row">'+btns(c)+'</div></div>'}
function b(id,w,t,sec){return '<button'+(sec?' class="sec"':'')+' onclick="act('+id+',\''+w+'\')">'+t+'</button>'}
function btns(c){var st=c.st||"work",i=c.id,x=b(i,"edit","Editar",1)+b(i,"del","Excluir",1);
if(st!=="work")return b(i,"start","Iniciar serviço")+x;
if(c.done)return b(i,"undo","Reabrir",1)+x;
return b(i,"done","Marcar pronto")+b(i,"pause",c.pausedAt?"▶ Retomar":"⏸ Pausar",1)+b(i,"plus","+30 min",1)+x}
function render(){
var now=Date.now(),cnt={work:0,queue:0,sched:0};
items.forEach(function(c){cnt[c.st||"work"]++});
$("tabs").innerHTML=[["work","Em serviço"],["queue","Próximos"],["sched","Agenda (hoje e amanhã)"]].map(function(t){
return '<button class="tab'+(tab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+' ('+cnt[t[0]]+')</button>'}).join("");
var a=items.filter(function(c){return (c.st||"work")===tab});
if(tab==="work")a.sort(function(x,y){return (x.done?1:0)-(y.done?1:0)||x.t-y.t});
if(tab==="sched")a.sort(function(x,y){return x.ag-y.ag});
if(!a.length){$("list").innerHTML='<div class="empty">Nada aqui por enquanto.</div>';return}
var out="",last="";
a.forEach(function(c){if(tab==="sched"){var g=dlabel(c.ag);if(g!==last){out+='<h2 class="grp">'+g+'</h2>';last=g}}out+=card(c,now)});
$("list").innerHTML=out}
function resume(c){if(c.pausedAt){var d=Date.now()-c.pausedAt;c.t+=d;if(c.s)c.s+=d;c.pausedAt=null}}
function act(id,w){
var c=items.filter(function(x){return x.id===id})[0];if(!c)return;
if(w==="del"){if(!confirm("Excluir este carro?"))return;items=items.filter(function(x){return x.id!==id})}
else if(w==="edit"){fill(c);return}
else if(w==="start"){var v=prompt("Pronto até que horas? (ex.: 15:30)",c.t?hm(c.t):"");if(!v)return;
var m=v.match(/^(\d{1,2})[:h](\d{2})$/);if(!m){alert("Use o formato 15:30");return}
var d=new Date();d.setHours(+m[1],+m[2],0,0);c.t=d.getTime();c.s=Date.now();c.st="work";c.done=false;tab="work"}
else if(w==="done"){c.done=true;resume(c)}
else if(w==="undo")c.done=false;
else if(w==="plus")c.t+=1800000;
else if(w==="pause"){if(c.pausedAt){resume(c);c.obs=""}else{var o=prompt("Observação da pausa (ex.: aguardando peça):");if(o===null)return;c.pausedAt=Date.now();c.obs=o}}
save();render()}
function loc(t){var d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function fill(c){editId=c.id;$("dest").value=c.st||"work";$("os").value=c.os||"";$("placa").value=c.placa||"";$("carro").value=c.carro||"";
$("serv").value=c.serv||"";$("mec").value=c.mec||"";$("hora").value=c.t?hm(c.t):"";$("ag").value=c.ag?loc(c.ag):"";
$("add").textContent="Salvar alterações";$("cancel").style.display="";window.scrollTo(0,0)}
function clearForm(){editId=null;["os","placa","carro","serv","mec","hora","ag"].forEach(function(i){$(i).value=""});
$("add").textContent="Adicionar";$("cancel").style.display="none"}
$("cancel").onclick=clearForm;
$("add").onclick=function(){
var dest=$("dest").value,hv=$("hora").value,av=$("ag").value;
if(dest==="work"&&!hv){alert("Escolha a hora em que o carro fica pronto.");return}
if(dest==="sched"&&!av){alert("Escolha o dia e a hora do agendamento.");return}
var c=editId?items.filter(function(x){return x.id===editId})[0]:null,isNew=!c;
if(isNew){c={id:Date.now(),done:false};items.push(c)}
var prev=isNew?null:(c.st||"work");
c.st=dest;c.os=$("os").value;c.placa=$("placa").value.toUpperCase();c.carro=$("carro").value;c.serv=$("serv").value;c.mec=$("mec").value;
if(hv){var p=hv.split(":"),d=new Date(c.t||Date.now());d.setHours(+p[0],+p[1],0,0);c.t=d.getTime()}else if(dest!=="work")c.t=null;
if(av)c.ag=new Date(av).getTime();
if(dest==="work"&&prev!=="work")c.s=Date.now();
tab=dest;clearForm();save();render()};
function tick(){var n=new Date();$("clock").textContent=pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds());render()}
tick();pull();setInterval(tick,1000);setInterval(pull,5000);
</script>
</body>
</html>
